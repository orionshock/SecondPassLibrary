name: Set up repository verification
description: Install the repository's declared Python, Node.js, npm, and verification dependencies.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install verification dependencies
      shell: bash
      run: |
        set -euo pipefail
        npm_version=$(node -p "require('./frontend/package.json').packageManager.split('@')[1]")
        npm install --global "npm@$npm_version"
        python -m pip install --disable-pip-version-check -r requirements-dev.txt pip-audit
        npm --prefix frontend ci
