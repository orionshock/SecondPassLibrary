name: Set up repository verification
description: Install the repository's declared Python, Node.js, npm, and verification dependencies.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: .python-version

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version

    - name: Restore npm download cache
      uses: actions/cache@v4.1.2
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('.node-version', 'frontend/package.json', 'frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install verification dependencies
      shell: bash
      run: |
        set -euo pipefail
        npm_version=$(node -p "require('./frontend/package.json').packageManager.split('@')[1]")
        # The Gitea runner reuses setup-python's installed tool environment. Its
        # pip download directory is absent on warm runs, so a cross-run cache
        # action only produced misses and an empty-path save warning.
        echo "pip cache directory: $(python -m pip cache dir)"
        npm install --global "npm@$npm_version"
        python -m pip install --disable-pip-version-check -r requirements-dev.txt pip-audit
        npm --prefix frontend ci
