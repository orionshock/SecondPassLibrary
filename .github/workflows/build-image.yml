name: Build production image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable development image to the configured registry.
        required: true
        default: false
        type: boolean

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}

jobs:
  build:
    name: Build and smoke image
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Derive development image metadata
        id: metadata
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          describe=$(git describe --tags --always --dirty)
          version="dev-$describe"
          release_date=$(git log -1 --format=%cs)
          if [ "$PUBLISH" = true ]; then
            test -n "$REGISTRY_IMAGE" || {
              echo "Repository variable REGISTRY_IMAGE is required to publish." >&2
              exit 1
            }
            image="${REGISTRY_IMAGE}:dev-sha-${GITHUB_SHA}"
          else
            image="secondpasslibrary:dev-sha-${GITHUB_SHA}"
          fi
          {
            echo "version=$version"
            echo "release_date=$release_date"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Build and smoke production image
        uses: ./.github/actions/build-production-image
        with:
          tags: ${{ steps.metadata.outputs.image }}
          smoke_image: ${{ steps.metadata.outputs.image }}
          server_version: ${{ steps.metadata.outputs.version }}
          release_date: ${{ steps.metadata.outputs.release_date }}

      - name: Require registry credentials
        if: ${{ inputs.publish }}
        shell: bash
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_HOST" || { echo "REGISTRY_HOST is required." >&2; exit 1; }
          test -n "$REGISTRY_USERNAME" || { echo "REGISTRY_USERNAME is required." >&2; exit 1; }
          test -n "$REGISTRY_TOKEN" || { echo "REGISTRY_TOKEN is required." >&2; exit 1; }

      - name: Log in to registry
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Publish immutable development image
        if: ${{ inputs.publish }}
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: docker push "$IMAGE"

      - name: Prove published image is independently pullable
        if: ${{ inputs.publish }}
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          set -euo pipefail
          docker image rm "$IMAGE"
          docker pull "$IMAGE"
          docker image inspect --format 'pulled {{index .RepoDigests 0}}' "$IMAGE"
