name: Build production image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable development image and update the dev channel.
        required: true
        default: false
        type: boolean

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}

jobs:
  build:
    name: Build and smoke image
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive development image metadata
        id: metadata
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          describe=$(git describe --tags --always --dirty)
          version="dev-$describe"
          release_date=$(git log -1 --format=%cs)
          if [ "$PUBLISH" = true ]; then
            test -n "$REGISTRY_IMAGE" || {
              echo "Repository variable REGISTRY_IMAGE is required to publish." >&2
              exit 1
            }
            immutable_image="${REGISTRY_IMAGE}:dev-sha-${GITHUB_SHA}"
            dev_image="${REGISTRY_IMAGE}:dev"
            build_tags=$(printf '%s\n%s' "$immutable_image" "$dev_image")
          else
            immutable_image="secondpasslibrary:dev-sha-${GITHUB_SHA}"
            dev_image=""
            build_tags=$immutable_image
          fi
          {
            echo "version=$version"
            echo "release_date=$release_date"
            echo "immutable_image=$immutable_image"
            echo "dev_image=$dev_image"
            echo "build_tags<<EOF"
            echo "$build_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and smoke production image
        uses: ./.github/actions/build-production-image
        with:
          tags: ${{ steps.metadata.outputs.build_tags }}
          smoke_image: ${{ steps.metadata.outputs.immutable_image }}
          server_version: ${{ steps.metadata.outputs.version }}
          release_date: ${{ steps.metadata.outputs.release_date }}

      - name: Require registry credentials
        if: ${{ inputs.publish }}
        shell: bash
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_HOST" || { echo "REGISTRY_HOST is required." >&2; exit 1; }
          test -n "$REGISTRY_USERNAME" || { echo "REGISTRY_USERNAME is required." >&2; exit 1; }
          test -n "$REGISTRY_TOKEN" || { echo "REGISTRY_TOKEN is required." >&2; exit 1; }

      - name: Log in to registry
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Publish immutable development image
        if: ${{ inputs.publish }}
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.metadata.outputs.immutable_image }}
        run: docker push "$IMMUTABLE_IMAGE"

      - name: Verify immutable development artifact from registry
        if: ${{ inputs.publish }}
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.metadata.outputs.immutable_image }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
          EXPECTED_RELEASE_DATE: ${{ steps.metadata.outputs.release_date }}
        run: |
          set -euo pipefail
          docker image rm "$IMMUTABLE_IMAGE"
          docker pull "$IMMUTABLE_IMAGE"
          docker run --rm --entrypoint python \
            --env EXPECTED_VERSION \
            --env EXPECTED_RELEASE_DATE \
            "$IMMUTABLE_IMAGE" -c \
            'import os; from secondpass.version import SERVER_RELEASE_DATE, SERVER_VERSION; assert SERVER_VERSION == os.environ["EXPECTED_VERSION"]; assert SERVER_RELEASE_DATE == os.environ["EXPECTED_RELEASE_DATE"]'

      - name: Publish development channel
        if: ${{ inputs.publish }}
        shell: bash
        env:
          DEV_IMAGE: ${{ steps.metadata.outputs.dev_image }}
        run: docker push "$DEV_IMAGE"

      - name: Prove development tags resolve to the same artifact
        if: ${{ inputs.publish }}
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.metadata.outputs.immutable_image }}
          DEV_IMAGE: ${{ steps.metadata.outputs.dev_image }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
          EXPECTED_RELEASE_DATE: ${{ steps.metadata.outputs.release_date }}
        run: |
          set -euo pipefail
          immutable_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMMUTABLE_IMAGE")
          immutable_digest=${immutable_digest#*@}
          docker image rm "$IMMUTABLE_IMAGE" "$DEV_IMAGE"
          docker pull "$DEV_IMAGE"
          dev_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$DEV_IMAGE")
          dev_digest=${dev_digest#*@}
          test "$immutable_digest" = "$dev_digest" || {
            echo "Development tag digest mismatch: immutable=$immutable_digest dev=$dev_digest" >&2
            exit 1
          }
          docker run --rm --entrypoint python \
            --env EXPECTED_VERSION \
            --env EXPECTED_RELEASE_DATE \
            "$DEV_IMAGE" -c \
            'import os; from secondpass.version import SERVER_RELEASE_DATE, SERVER_VERSION; assert SERVER_VERSION == os.environ["EXPECTED_VERSION"]; assert SERVER_RELEASE_DATE == os.environ["EXPECTED_RELEASE_DATE"]'
          echo "Verified $IMMUTABLE_IMAGE and $DEV_IMAGE at $dev_digest"
