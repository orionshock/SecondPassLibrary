name: Release

on:
  push:
    tags:
      - "alpha-rc[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}

jobs:
  publish:
    name: Build and publish release image
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          [[ "$tag" =~ ^alpha-rc[0-9]+(\.[0-9]+)?$ ]] || {
            echo "Unsupported release tag: $tag" >&2
            exit 1
          }

      - name: Check out complete Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require registry configuration
        shell: bash
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_HOST" || { echo "REGISTRY_HOST is required." >&2; exit 1; }
          test -n "$REGISTRY_IMAGE" || { echo "REGISTRY_IMAGE is required." >&2; exit 1; }
          test -n "$REGISTRY_USERNAME" || { echo "REGISTRY_USERNAME is required." >&2; exit 1; }
          test -n "$REGISTRY_TOKEN" || { echo "REGISTRY_TOKEN is required." >&2; exit 1; }

      - name: Derive release image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          version=$(git describe --tags --always --dirty)
          release_date=$(git log -1 --format=%cs)
          {
            echo "version=$version"
            echo "release_date=$release_date"
            echo "immutable_image=${REGISTRY_IMAGE}:sha-${GITHUB_SHA}"
            echo "release_image=${REGISTRY_IMAGE}:$tag"
            echo "images<<EOF"
            echo "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}"
            echo "${REGISTRY_IMAGE}:$tag"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and smoke production image
        uses: ./.github/actions/build-production-image
        with:
          tags: ${{ steps.metadata.outputs.images }}
          smoke_image: ${{ steps.metadata.outputs.immutable_image }}
          server_version: ${{ steps.metadata.outputs.version }}
          release_date: ${{ steps.metadata.outputs.release_date }}

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Publish release image tags
        shell: bash
        env:
          IMAGES: ${{ steps.metadata.outputs.images }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            [ -n "$image" ] && docker push "$image"
          done <<< "$IMAGES"

      - name: Verify published release artifact and tag identity
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.metadata.outputs.immutable_image }}
          RELEASE_IMAGE: ${{ steps.metadata.outputs.release_image }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
          EXPECTED_RELEASE_DATE: ${{ steps.metadata.outputs.release_date }}
        run: |
          set -euo pipefail
          docker image rm "$IMMUTABLE_IMAGE" "$RELEASE_IMAGE"
          docker pull "$IMMUTABLE_IMAGE"
          immutable_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMMUTABLE_IMAGE")
          immutable_digest=${immutable_digest#*@}
          tools/smoke-production-image.sh "$IMMUTABLE_IMAGE" "$EXPECTED_VERSION" "$EXPECTED_RELEASE_DATE"
          docker pull "$RELEASE_IMAGE"
          release_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$RELEASE_IMAGE")
          release_digest=${release_digest#*@}
          test "$immutable_digest" = "$release_digest" || {
            echo "Release tag digest mismatch: immutable=$immutable_digest release=$release_digest" >&2
            exit 1
          }
          echo "Verified $IMMUTABLE_IMAGE and $RELEASE_IMAGE at $release_digest"
