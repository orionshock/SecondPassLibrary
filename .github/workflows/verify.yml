name: Verify

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Normal verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up verification environment
        uses: ./.github/actions/setup-verification

      - name: Run canonical normal verification
        run: python tools/verify.py --lane fast
