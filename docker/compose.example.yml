name: secondpasslibrary

# Shared application environment for the web server and maintenance worker.
# Replace the secret, host, HTTPS origin, and Library URL placeholders.
x-app-environment: &app_environment
  DJANGO_SECRET_KEY: replace-me-with-a-generated-secret
  # Hostnames or IPs only, with no scheme or port.
  DJANGO_ALLOWED_HOSTS: your-hostname-or-domain
  # Use an IANA time zone name appropriate for the deployment.
  DJANGO_TIME_ZONE: UTC
  # Set the exact HTTPS origin served by your reverse proxy.
  DJANGO_CSRF_TRUSTED_ORIGINS: https://your-hostname-or-domain
  # The standard deployment terminates HTTPS at the operator's reverse proxy.
  DJANGO_SECURE_COOKIES: "1"
  # The proxy must replace, never pass through, incoming X-Forwarded-Proto.
  DJANGO_TRUST_X_FORWARDED_PROTO: "1"
  # Client-IP and forwarded-host trust are separate; leave them off by default.
  DJANGO_TRUST_X_FORWARDED_FOR: "0"
  # If enabling forwarded client IPs, list only direct proxy peers here.
  DJANGO_TRUSTED_PROXY_IPS: ""
  DJANGO_USE_X_FORWARDED_HOST: "0"
  SECOND_PASS_ENABLE_DJANGO_ADMIN: "0"
  SECOND_PASS_READER_WEB_CLIENT_URL: ""
  # Replace with Library base URLs from most preferred to least preferred.
  SECOND_PASS_LIBRARY_URLS: https://library.example.com
  DJANGO_SILENCED_SYSTEM_CHECKS: ""

services:
  server:
    # Replace the generic registry and tag with a published release image, or
    # override SECOND_PASS_IMAGE with its full immutable reference.
    image: ${SECOND_PASS_IMAGE:-registry.example.com/secondpasslibrary/secondpasslibrary:replace-with-release-tag}
    environment: *app_environment
    expose:
      - "8000"
    volumes:
      - secondpass_userdata:/app/userdata
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker:
    image: ${SECOND_PASS_IMAGE:-registry.example.com/secondpasslibrary/secondpasslibrary:replace-with-release-tag}
    environment: *app_environment
    volumes:
      - secondpass_userdata:/app/userdata
    network_mode: "none"
    command: ["worker"]
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  discovery:
    image: flungo/avahi@sha256:6f7b5dc693f6dc8338e53e32658078baa2a7674576965ae71d2ac51d0148d67f
    profiles: ["discovery"]
    network_mode: host
    environment:
      SERVER_ENABLE_DBUS: "no"
    command:
      - sh
      - -eu
      - -c
      - 'cp /secondpass.service /etc/avahi/services/secondpass.service; exec avahi-daemon'
    configs:
      - source: secondpass_discovery_service
        target: /secondpass.service
    tmpfs:
      - /etc/avahi/services
    restart: unless-stopped

volumes:
  secondpass_userdata:

configs:
  secondpass_discovery_service:
    content: |
      <?xml version="1.0" standalone="no"?>
      <!DOCTYPE service-group SYSTEM "avahi-service.dtd">
      <service-group>
        <name replace-wildcards="yes">Second Pass Library on %h</name>
        <service>
          <type>_secondpass._tcp</type>
          <!-- Copy the first SECOND_PASS_LIBRARY_URLS entry here. -->
          <port>443</port>
          <txt-record>url=https://library.example.com</txt-record>
        </service>
      </service-group>
