name: secondpasslibrary

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_UID: 1000
        APP_GID: 1000
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - secondpass_userdata:/app/userdata
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_UID: 1000
        APP_GID: 1000
    env_file:
      - .env
    volumes:
      - secondpass_userdata:/app/userdata
    network_mode: "none"
    command: ["worker"]
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  secondpass_userdata:
