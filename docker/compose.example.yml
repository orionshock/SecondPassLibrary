name: secondpasslibrary

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_UID: 1000
        APP_GID: 1000
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - secondpass_userdata:/app/userdata
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_UID: 1000
        APP_GID: 1000
    env_file:
      - .env
    volumes:
      - secondpass_userdata:/app/userdata
    network_mode: "none"
    command: ["worker"]
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  discovery:
    image: flungo/avahi@sha256:6f7b5dc693f6dc8338e53e32658078baa2a7674576965ae71d2ac51d0148d67f
    profiles: ["discovery"]
    network_mode: host
    environment:
      SECOND_PASS_LIBRARY_URL: ${SECOND_PASS_LIBRARY_URL:-}
      SERVER_ENABLE_DBUS: "no"
    command:
      - sh
      - -eu
      - -c
      - ': "$${SECOND_PASS_LIBRARY_URL:?Set SECOND_PASS_LIBRARY_URL to the externally reachable Library URL}"; cp /secondpass.service /etc/avahi/services/secondpass.service; exec avahi-daemon'
    configs:
      - source: secondpass_discovery_service
        target: /secondpass.service
    tmpfs:
      - /etc/avahi/services
    restart: unless-stopped

volumes:
  secondpass_userdata:

configs:
  secondpass_discovery_service:
    content: |
      <?xml version="1.0" standalone="no"?>
      <!DOCTYPE service-group SYSTEM "avahi-service.dtd">
      <service-group>
        <name replace-wildcards="yes">Second Pass Library on %h</name>
        <service>
          <type>_secondpass._tcp</type>
          <port>${SECOND_PASS_DISCOVERY_PORT:-443}</port>
          <txt-record>url=${SECOND_PASS_LIBRARY_URL:-}</txt-record>
        </service>
      </service-group>
