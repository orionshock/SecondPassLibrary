services:
  secondpasslibrary:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_UID: 1000
        APP_GID: 1000
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - secondpass_userdata:/app/userdata
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; host = os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); request = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': host}); urllib.request.urlopen(request, timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  secondpasslibrary-maintenance-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_UID: 1000
        APP_GID: 1000
    env_file:
      - .env
    volumes:
      - secondpass_userdata:/app/userdata
    network_mode: "none"
    command: ["worker"]
    depends_on:
      secondpasslibrary:
        condition: service_healthy
    restart: unless-stopped

volumes:
  secondpass_userdata:
