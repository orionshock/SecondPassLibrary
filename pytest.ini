[pytest]
DJANGO_SETTINGS_MODULE = secondpass.settings
testpaths = tests
python_files = test_*.py
python_classes = *Tests *Test *TestCase
python_functions = test_*
markers =
    unit: isolated unit tests
    db: tests that require database access
    filesystem: tests that touch filesystem-backed runtime paths
    product_ui: product UI/template/static contract tests
    integration: cross-module or HTTP/API integration tests
    slow: slower tests that should be selected intentionally
