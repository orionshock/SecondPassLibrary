[pytest]
addopts = -p no:cacheprovider
DJANGO_SETTINGS_MODULE = secondpass.settings
pythonpath = backend
testpaths = tests
python_files = test_*.py
python_classes = *Tests *Test *TestCase
python_functions = test_*
markers =
    security: authentication, authorization, anti-enumeration, credential, archive-safety, destructive-operation, and immutable-policy boundaries
    concurrency: real thread, executor, barrier, or competing-transaction behavior
    subprocess: real server, subprocess, or separate-interpreter behavior
    filesystem: behavior whose contract depends on files, media, archives, temporary directories, static output, or storage cleanup
    integration: behavior spanning multiple real application layers that cannot be replaced by a lower-level test
    slow: measured or inherently expensive tests excluded only from the explicit fast lane
