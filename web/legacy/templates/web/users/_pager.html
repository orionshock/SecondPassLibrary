<div id="users-pager-{{ position }}" class="pager library-pager users-pager{% if sticky %} library-pager--sticky{% endif %}" aria-label="Users pagination">
  <div id="users-range-{{ position }}" class="library-pager__range" aria-live="polite">Showing 0 of 0</div>
  <label class="library-pager__page-size" for="users-page-size-{{ position }}">
    <span>Per page</span>
    <select id="users-page-size-{{ position }}" data-users-page-size name="page_size">
      <option value="20" selected>20</option>
      <option value="30">30</option>
      <option value="40">40</option>
      <option value="50">50</option>
    </select>
  </label>
  <div class="library-pager__actions">
    <button id="users-prev-{{ position }}" class="button" type="button" disabled>Previous</button>
    <button id="users-next-{{ position }}" class="button" type="button" disabled>Next</button>
  </div>
</div>
