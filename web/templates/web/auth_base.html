{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ server_name }}{% endblock %}</title>
    <link rel="icon" href="{% static 'web/favicon.png' %}" type="image/png" />
    <link rel="stylesheet" href="{% static 'web/app.css' %}" />
  </head>
  <body class="setup-page">
    <main class="setup-shell">
      <section class="card setup-card">
        <div class="setup-brand">
          <img class="brand__icon" src="{% static 'web/favicon.png' %}" alt="" aria-hidden="true" />
          <span>{{ server_name }}</span>
        </div>
        {% block content %}{% endblock %}
      </section>
    </main>
  </body>
</html>
