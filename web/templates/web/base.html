{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ server_name }}{% endblock %}</title>
    <link rel="icon" href="{% static 'web/favicon.png' %}" type="image/png" />
    <link rel="stylesheet" href="{% static 'web/app.css' %}" />
    <script type="module" src="{% static 'web/js/main.js' %}"></script>
  </head>
  <body data-page="{% block page_id %}{% endblock %}">
    <header class="topbar">
      <div class="container topbar__inner">
        <a class="brand" href="/app/">{{ server_name }}</a>
        <nav class="nav" aria-label="Primary">
          <a class="nav__item" href="/library/" data-nav="library">Library</a>
          <a class="nav__item" href="/shelves/" data-nav="shelves">Shelves</a>
          <a class="nav__item is-hidden" href="/groups/" data-nav="groups">Groups</a>
          <a class="nav__item is-hidden" href="/imports/" data-nav="imports">Imports</a>
          <a class="nav__item is-hidden" href="/users/" data-nav="users">Users</a>
          <a class="nav__item is-hidden" href="/server/" data-nav="server-settings">Server Settings</a>
        </nav>
        <div class="userbox">
          <a class="userbox__name" href="/profile/" data-ui="username">Loading…</a>
          <form class="userbox__logoutform" action="/api-auth/logout/" method="post">
            {% csrf_token %}
            <button class="linklike" type="submit">Logout</button>
          </form>
        </div>
      </div>
    </header>

    <div class="container">
      <div id="ui-global-error" class="error is-hidden" role="alert"></div>
    </div>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer container">
      <small>{{ server_name }}</small>
    </footer>
  </body>
</html>
