{% extends "web/base.html" %}

{% block page_id %}book-detail{% endblock %}

{% block title %}Book · Second Pass Library{% endblock %}

{% block content %}
  <div class="page-header">
    <div>
      <a href="/library/" class="pill">← Back to Library</a>
      <h1 class="page-title" id="book-title">Book</h1>
    </div>
    <div id="book-edit-link-wrap" class="is-hidden">
      <a id="book-edit-link" class="button" href="/library/books/{{ book_id|escape }}/edit/">Edit metadata</a>
    </div>
  </div>

  <div id="book-status" class="muted">Loading…</div>

  <section id="book-detail" class="card is-hidden" data-book-id="{{ book_id|escape }}">
    <h2 class="card__title">Details</h2>
    <div id="book-meta"></div>
  </section>

  <section id="book-identifiers" class="card is-hidden">
    <h2 class="card__title">Identifiers</h2>
    <div id="book-identifiers-body" class="muted"></div>
  </section>

  <section id="book-files" class="card is-hidden">
    <h2 class="card__title">Files</h2>
    <div id="book-files-body" class="muted"></div>
  </section>

  <section id="book-groups" class="card is-hidden">
    <h2 class="card__title">Groups</h2>
    <div id="book-groups-body" class="muted"></div>
  </section>

  <section id="book-shelves" class="card is-hidden">
    <h2 class="card__title">Shelves</h2>
    <div id="book-shelves-body" class="muted"></div>
  </section>
{% endblock %}
