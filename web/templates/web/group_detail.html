{% extends "web/base.html" %}

{% block page_id %}group-view{% endblock %}

{% block title %}Group · Second Pass Library{% endblock %}

{% block content %}
  <div class="page-header">
    <div>
      <a href="/groups/" class="pill">← Back to Groups</a>
      <h1 class="page-title" id="group-view-title">Group</h1>
      <div class="muted" id="group-view-subtitle"></div>
    </div>
    <div style="text-align: right;">
      <div id="group-view-edit-link-wrap" class="is-hidden" style="margin-top: 6px;">
        <a id="group-view-edit-link" class="button" href="/groups/{{ group_id|escape }}/edit/">Edit</a>
      </div>
    </div>
  </div>

  <div id="group-view-status" class="muted">Loading…</div>

  <section id="group-view-summary" class="card is-hidden" data-group-id="{{ group_id|escape }}">
    <h2 class="card__title">Details</h2>
    <div id="group-view-badges"></div>
    <div id="group-view-description" style="margin-top: 10px;"></div>
  </section>

  <section id="group-view-root" class="card is-hidden" data-group-id="{{ group_id|escape }}">
    <div class="tabs" role="tablist" aria-label="Group view tabs">
      <button class="tab-button is-active" type="button" data-tab="books">Books</button>
      <button class="tab-button" type="button" data-tab="members">Members</button>
      <button class="tab-button" type="button" data-tab="shelves">Shelves</button>
    </div>

    <div id="tab-books" class="tab-panel" data-tab-panel="books">
      <h2 class="card__title">Books</h2>
      <div id="group-view-books-status" class="muted" style="margin-top: 10px;">Loading…</div>
      <div id="group-view-books-results" class="books"></div>
      <div class="pager">
        <button id="group-view-books-prev" class="button" type="button" disabled>Previous</button>
        <button id="group-view-books-next" class="button" type="button" disabled>Next</button>
      </div>
    </div>

    <div id="tab-members" class="tab-panel is-hidden" data-tab-panel="members">
      <h2 class="card__title">Members</h2>
      <div id="group-view-members-note" class="muted"></div>
      <div id="group-view-members-status" class="muted" style="margin-top: 10px;">Loading…</div>
      <div id="group-view-members-results" class="books"></div>
      <div class="pager">
        <button id="group-view-members-prev" class="button" type="button" disabled>Previous</button>
        <button id="group-view-members-next" class="button" type="button" disabled>Next</button>
      </div>
    </div>

    <div id="tab-shelves" class="tab-panel is-hidden" data-tab-panel="shelves">
      <h2 class="card__title">Shelves</h2>
      <div id="group-view-shelves-status" class="muted" style="margin-top: 10px;">Loading…</div>
      <div id="group-view-shelves-results" class="books"></div>
      <div class="pager">
        <button id="group-view-shelves-prev" class="button" type="button" disabled>Previous</button>
        <button id="group-view-shelves-next" class="button" type="button" disabled>Next</button>
      </div>
    </div>
  </section>
{% endblock %}
