<div id="shelf-edit-items-pager-{{ position }}" class="pager library-pager shelf-edit-pager{% if sticky %} library-pager--sticky{% endif %}" aria-label="Shelf books pagination">
  <div id="shelf-edit-items-range-{{ position }}" class="library-pager__range" aria-live="polite">Showing 0 of 0</div>
  <label class="library-pager__page-size" for="shelf-edit-items-page-size-{{ position }}">
    <span>Per page</span>
    <select id="shelf-edit-items-page-size-{{ position }}" data-shelf-edit-page-size name="page_size">
      <option value="20" selected>20</option>
      <option value="30">30</option>
      <option value="40">40</option>
      <option value="50">50</option>
    </select>
  </label>
  <div class="library-pager__actions">
    <button id="shelf-edit-items-prev-{{ position }}" class="button" type="button" disabled>Previous</button>
    <button id="shelf-edit-items-next-{{ position }}" class="button" type="button" disabled>Next</button>
  </div>
</div>
