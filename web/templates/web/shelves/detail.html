{% extends "web/base.html" %}

{% block page_id %}shelf-view{% endblock %}

{% block title %}Shelf - {{ server_name }}{% endblock %}

{% block content %}
  <div class="page-header">
    <div>
      <a href="/shelves/" class="pill back-link"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span><span>Back to Shelves</span></a>
      <div class="shelf-view-heading">
        <h1 class="page-title" id="shelf-title">Shelf</h1>
        <div id="shelf-view-summary" class="shelf-view-summary"></div>
      </div>
    </div>
    <div id="shelf-view-edit-wrap" class="is-hidden">
      <a id="shelf-view-edit-link" class="button" href="/shelves/{{ shelf_id|escape }}/edit/">Edit</a>
    </div>
  </div>

  <div id="shelf-view-status" class="muted">Loading...</div>
  <div id="shelf-view-error" class="error is-hidden"></div>

  <section id="shelf-view" class="shelf-view-context is-hidden" data-shelf-id="{{ shelf_id|escape }}">
    <p id="shelf-view-description" class="shelf-view-description is-hidden"></p>
    <div id="shelf-view-created-by" class="muted shelf-view-created-by is-hidden"></div>
  </section>

  <section id="shelf-view-items" class="shelf-view-items is-hidden">
    <div id="shelf-view-items-status" class="muted"></div>
    <div id="shelf-view-items-results" class="muted"></div>
    <div class="pager">
      <button id="shelf-view-items-prev" class="button" type="button">Previous</button>
      <button id="shelf-view-items-next" class="button" type="button">Next</button>
      <span id="shelf-view-items-page-note" class="muted"></span>
    </div>
  </section>
{% endblock %}
