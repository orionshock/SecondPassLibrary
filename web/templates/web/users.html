{% extends "web/base.html" %}

{% block page_id %}users{% endblock %}

{% block title %}Users · {{ server_name }}{% endblock %}

{% block content %}
  <div class="page-header">
    <h1 class="page-title">Users</h1>
    <a id="users-create-link" class="button is-hidden" href="/users/new/">Create user</a>
  </div>

  <p class="muted">Create local Django users and manage basic profile fields.</p>

  <div id="users-not-allowed" class="error is-hidden" role="alert">Not allowed.</div>

  <section class="card">
    <h2 class="card__title">User List</h2>

    <div id="users-filters" class="users-filters is-hidden" aria-label="User filters">
      <button class="button" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="button" type="button" data-filter="readers" aria-pressed="false">Readers</button>
      <button class="button" type="button" data-filter="curators" aria-pressed="false">Curators</button>
      <button class="button" type="button" data-filter="librarians" aria-pressed="false">Librarians</button>
      <button class="button" type="button" data-filter="managers" aria-pressed="false">Managers</button>
      <button class="button" type="button" data-filter="inactive" aria-pressed="false">Inactive</button>
    </div>

    <div id="users-status" class="muted">Loading…</div>
    <div id="users-results" class="users-rows"></div>

    <div class="pager">
      <button id="users-prev" class="button" type="button" disabled>Previous</button>
      <button id="users-next" class="button" type="button" disabled>Next</button>
    </div>
  </section>
{% endblock %}
